<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zoom Ops</title>
<script>
  // Applied before first paint to avoid a light-mode flash when the saved theme is dark.
  try {
    if ((localStorage.getItem("zoomops-theme") || "dark") === "dark") document.documentElement.classList.add("dark");
  } catch {}
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: "class" };
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
<div id="root"></div>
<script src="icons.js"></script>
<script src="app.js"></script>
<script src="tabs.js"></script>
</body>
</html>
