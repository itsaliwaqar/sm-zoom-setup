name = "sm-zoom-setup"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Static admin UI, served from /admin/*
# run_worker_first ensures ALL requests (including GET) hit the Worker before the asset layer,
# so dynamic routes like /webhooks/register/:slug are not intercepted with a 404 by the asset
# handler just because no matching file exists.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Two schedules: every 15 min runs due-job creation + attendance sync; every 30 min proactively
# refreshes the Zoom access token (it expires hourly) - see scheduled() in src/index.ts.
[triggers]
crons = ["*/15 * * * *", "*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "zoom_setup_db"
database_id = "2967b066-23b2-4fdd-af5b-ff92af81e3d4"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "a08893d548364d89b9d719c925251ea6"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   ADMIN_API_KEY        - shared secret for all /api/* admin endpoints
#   ZOOM_ACCOUNT_ID
#   ZOOM_CLIENT_ID
#   ZOOM_CLIENT_SECRET
#   GHL_PRIVATE_TOKEN
#   GHL_DEFAULT_LOCATION_ID
#
# Non-secret vars can go here, e.g.:
# [vars]
# PUBLIC_BASE_URL = "https://sm-zoom-setup.<your-subdomain>.workers.dev"
